[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tree_compress"
version = "1.0.0"
authors = [
  { name="Laurens Devos"}, { name="Timo Martens"}
]
description = "Compressing Tree Ensembles through Level-wise Optimization and Pruning"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy >= 1.26",
    "scikit-learn >= 1.4",
    "scipy >= 1.12",
    "dtai-veritas >= 0.2",
    "colorama",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ML-KULeuven/lop_compress"
Issues = "https://github.com/ML-KULeuven/lop_compress/issues"
