name: Build and Publish Wheels (Nuitka)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka setuptools wheel build twine
      - name: Compile compress.py with Nuitka
        run: python -m nuitka --module src/tree_compress/compress.py --output-dir=src/tree_compress

      - name: Remove original compress.py (Linux/macOS)
        if: runner.os != 'Windows'
        run: rm src/tree_compress/compress.py

      - name: Remove original compress.py (Windows)
        if: runner.os == 'Windows'
        run: del src\tree_compress\compress.py

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheels as artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

      - name: Publish wheel to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ICML')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*.whl