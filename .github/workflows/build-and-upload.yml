name: Build and Publish Wheels

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-upload:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
        python-version: [3.10]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtualenv
        shell: bash
        run: |
          python -m venv venv
          . venv/bin/activate || source venv/bin/activate || venv\Scripts\activate
          python -m pip install --upgrade pip
          pip install build wheel twine setuptools

      - name: Build wheel
        shell: bash
        run: |
          . venv/bin/activate || source venv/bin/activate || venv\Scripts\activate
          python -m build --wheel --no-isolation

      - name: Upload wheel to PyPI
        shell: bash
        run: |
          . venv/bin/activate || source venv/bin/activate || venv\Scripts\activate
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Clean up dist folder (Linux/macOS)
        if: runner.os != 'Windows'
        run: rm -rf dist/

      - name: Clean up dist folder (Windows)
        if: runner.os == 'Windows'
        run: Remove-Item -Recurse -Force dist
        shell: pwsh
